<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — myAlternates</title>
<meta name="theme-color" content="#0B0E13">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:32px;
    text-align:center;
    background:#0B0E13;
    color:#F7F4ED;
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .mark{
    width:84px;
    height:84px;
    border-radius:50%;
    background:#D0A867;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    font-size:34px;
    font-weight:600;
    font-style:italic;
    color:#12161D;
  }
  h1{font-size:20px; font-weight:600;}
  p{max-width:32ch; line-height:1.6; color:#9A9E9C; font-size:14px;}
  button{
    margin-top:8px;
    padding:12px 22px;
    border:1px solid #C9A24B;
    border-radius:2px;
    background:transparent;
    color:#E9D19E;
    font:inherit;
    font-weight:600;
    cursor:pointer;
  }
  button:active{background:#1B212B;}
</style>
</head>
<body>
  <div class="mark">my</div>
  <h1>You're offline</h1>
  <p>This page isn't available without a connection yet. Pages you've already visited will still open.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
